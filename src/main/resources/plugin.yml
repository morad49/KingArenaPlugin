name: KingArena
version: 1.0.0
main: com.kingarena.KingArenaPlugin
api-version: "1.21"
author: Developer
description: Physical glass barrier system and King PvP state machine for WorldGuard regions.
depend: [WorldGuard]

commands:
  king:
    description: Main command for KingArena plugin
    usage: /king [setarena|setspawn|join|leave|reload]
    permission: kingarena.use
    aliases: [kingarena, arena]

permissions:
  kingarena.admin:
    description: Allows administrative actions for KingArena
    default: op
  kingarena.use:
    description: Allows player actions for KingArena
    default: true
